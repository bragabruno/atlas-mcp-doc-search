# atlas-mcp-doc-search/deploy/values.yaml — chart defaults (atlas-docs/04 §4.2).
# MCP server over FastMCP Streamable HTTP (port 8000). Secrets (ES creds,
# Qdrant API key, gateway API key) are mounted from Azure Key Vault via the
# Secrets Store CSI driver — never baked into the image or a plain Kubernetes
# Secret (atlas-docs/04 §3).

replicaCount: 2

image:
  repository: acr.azurecr.io/atlas/mcp-doc-search
  tag: ""  # overridden at deploy time with the git SHA (atlas-docs/04 §4.2)
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Argo Rollouts canary. false → a plain Deployment is rendered; true (set in
# values-prod.yaml) → a Rollout with the canary strategy below (atlas-docs §5.4).
canary:
  enabled: false
  steps:
    - setWeight: 10
    - pause: { duration: 5m }
    - analysis:
        templates:
          - templateName: slo-check
    - setWeight: 50
    - pause: { duration: 5m }
    - analysis:
        templates:
          - templateName: slo-check
  autoPromotionEnabled: false

serviceAccount:
  create: true
  name: ""
  annotations:
    # Azure Workload Identity client-id — injected by Terraform output / CI.
    azure.workload.identity/client-id: ""

podAnnotations: {}
podLabels:
  # Required for Azure Workload Identity token projection.
  azure.workload.identity/use: "true"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

containerPort: 8000

# FastMCP Streamable HTTP exposes /mcp as the MCP endpoint.
# Probes hit /health (a lightweight FastMCP built-in or a custom handler).
probes:
  path: /health
  startup:
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# GenAI semconv opt-in — emits gen_ai.* span attributes (atlas-docs/04 §6.1).
# OTLP targets the node-local OTel Collector DaemonSet via the host IP.
# Secret values come from the CSI mount, not here.
env:
  - name: OTEL_SEMCONV_STABILITY_OPT_IN
    value: gen_ai_latest_experimental
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://$(HOST_IP):4317
  - name: OTEL_SERVICE_NAME
    value: atlas-mcp-doc-search
  - name: HOST_IP
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
  # Non-secret service endpoints (in-cluster). Credentials come from CSI mounts.
  - name: ELASTICSEARCH_URL
    value: "http://elasticsearch.atlas-platform.svc:9200"
  - name: QDRANT_URL
    value: "http://qdrant.atlas-platform.svc:6333"
  - name: ATLAS_GATEWAY_URL
    value: "http://atlas-gateway.atlas-platform.svc:8000"

# Azure Key Vault → Secrets Store CSI driver. Mounted at secrets.mountPath as
# files; the app reads credentials from the filesystem (atlas-docs/04 §3).
# keyVaultName / tenantId are injected per env.
secrets:
  enabled: true
  mountPath: /mnt/secrets
  keyVaultName: ""
  tenantId: ""
  # User-assigned managed identity client-id used by the CSI provider.
  userAssignedIdentityID: ""
  objects:
    # Atlas Gateway API key for embedding calls (/v1/embeddings).
    - objectName: gateway-api-key
      objectType: secret
    # Elasticsearch credentials (if auth is enabled).
    - objectName: elasticsearch-api-key
      objectType: secret
    # Qdrant API key (if Qdrant Cloud or authenticated on-prem).
    - objectName: qdrant-api-key
      objectType: secret

# Ingress — exposes the MCP Streamable HTTP endpoint to in-cluster callers
# and optionally to external consumers via nginx ingress controller.
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  hosts:
    - host: mcp-doc-search.atlas.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: atlas-mcp-doc-search-tls
      hosts:
        - mcp-doc-search.atlas.internal

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

# Horizontal Pod Autoscaler (enabled in prod; off in dev).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Hardened pod/container security context (non-root, read-only rootfs).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Prometheus/OTel scrape target.
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s

nodeSelector: {}
tolerations: []
affinity: {}
