{{- /*
ServiceAccount annotated with the Azure Workload Identity client-id (atlas-docs/04 §3).
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "atlas-mcp-doc-search.serviceAccountName" . }}
  labels:
    {{- include "atlas-mcp-doc-search.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
