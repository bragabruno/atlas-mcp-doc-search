{{- /*
Argo Rollouts AnalysisTemplate (slo-check) for canary promotion gating.
Thresholds per atlas-docs/04 §5.4. Rendered only when canary is on.
*/ -}}
{{- if .Values.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: slo-check
  labels:
    {{- include "atlas-mcp-doc-search.labels" . | nindent 4 }}
spec:
  args:
    - name: service
      value: {{ include "atlas-mcp-doc-search.fullname" . }}
  metrics:
    - name: error-rate
      interval: 1m
      count: 3
      failureLimit: 1
      successCondition: result[0] < 0.02
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{service="{{`{{args.service}}`}}",code=~"5.."}[3m]))
              /
            sum(rate(http_requests_total{service="{{`{{args.service}}`}}"}[3m]))
    - name: p95-latency
      interval: 1m
      count: 3
      failureLimit: 1
      successCondition: result[0] < 5
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc:9090
          query: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{service="{{`{{args.service}}`}}"}[3m])) by (le))
{{- end }}
