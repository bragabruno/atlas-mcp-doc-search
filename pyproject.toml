[project]
name = "atlas-mcp-doc-search"
version = "0.1.0"
description = "Atlas MCP doc-search server — hybrid BM25 + vector retrieval via RRF"
requires-python = ">=3.12"
dependencies = [
    "mcp==1.27.1",
    "elasticsearch==9.4.0",
    "aiohttp==3.13.5",              # required by AsyncElasticsearch transport; released 2026-03-31 (>14d)
    "qdrant-client==1.18.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.9.6",
    "pyright==1.1.394",
]
integration = [
    "testcontainers==4.14.2", # tests/integration ephemeral ES + Qdrant; released 2026-03-18 (>14d)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
# Integration tests (testcontainers, need Docker) are excluded from the default
# run so the offline suite stays offline; run them with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: requires Docker (testcontainers); excluded from the default offline run",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
